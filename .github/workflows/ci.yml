name: J.E.S.U.S CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build & Verify (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['17', '21'] # Java 25는 아직 GA 전일 수 있으므로 17 및 최신 LTS 중심으로 안정화

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build with Maven
        run: |
          echo "=================================================="
          echo " [✝️] Running J.E.S.U.S Maven Build (Java ${{ matrix.java-version }})"
          echo "=================================================="
          mvn clean package -DskipTests
          
          echo " [✨] Build and Packaging Successful!"
